{% extends "base.html" %}
{% block title %}Kayıt Ol — AI Akademi{% endblock %}
{% block content %}
<div class="card form-card">
  <h2>Hesap oluştur</h2>
  <form method="POST">
    <div class="field">
      <label for="username">Kullanıcı adı</label>
      <input type="text" id="username" name="username" required maxlength="80">
    </div>
    <div class="field">
      <label for="email">E-posta</label>
      <input type="email" id="email" name="email" required maxlength="120">
    </div>
    <div class="field">
      <label for="password">Şifre</label>
      <input type="password" id="password" name="password" required minlength="6">
    </div>
    <button type="submit" class="btn btn--primary">Kayıt ol</button>
  </form>
  <div class="switch">Zaten hesabın var mı? <a href="{{ url_for('login') }}">Giriş yap</a></div>
</div>
{% endblock %}
